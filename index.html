
<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Inmersión | Digitalización Inmobiliaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-bone: #F8F5F2;
            --text-charcoal: #2D2D2D;
            --accent-gold: #D9A036;
            --border-line: rgba(45, 45, 45, 0.08);
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-bone);
            color: var(--text-charcoal);
            letter-spacing: -0.01em;
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(45, 45, 45, 0.03) 1px, transparent 0),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-size: 40px 40px, auto;
            background-attachment: fixed;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .rounded-tight { border-radius: 1px; }

        .glass-panel {
            background: rgba(248, 245, 242, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(45, 45, 45, 0.05);
        }

        .industrial-card {
            background: #FFFFFF;
            border: 1px solid var(--border-line);
            border-left: 4px solid var(--text-charcoal);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .industrial-card:hover {
            border-left-color: var(--accent-gold);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(45, 45, 45, 0.1);
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 1px;
            background: rgba(45, 45, 45, 0.2);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 4px;
            border-radius: 0;
            background: var(--accent-gold);
            cursor: pointer;
            margin-top: -11px;
            border: none;
            box-shadow: 4px 4px 0px var(--text-charcoal);
            transition: transform 0.2s ease;
        }
        input[type=range]:active::-webkit-slider-thumb {
            transform: scaleY(1.2);
        }

        .marble-overlay {
            background-image: url('https://www.transparenttextures.com/patterns/marble-similar.png');
            opacity: 0.03;
            mix-blend-mode: multiply;
        }

        .btn-shadow {
            box-shadow: 6px 6px 0px var(--accent-gold);
        }
        .btn-shadow:active {
            box-shadow: 2px 2px 0px var(--accent-gold);
            transform: translate(2px, 2px);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, transparent, rgba(217, 160, 54, 0.05), transparent);
            height: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="min-h-screen relative overflow-x-hidden">
    <div class="fixed inset-0 marble-overlay pointer-events-none z-0"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
