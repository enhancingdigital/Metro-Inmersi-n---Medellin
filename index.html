
<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Virtual Tours | Digitalización Inmobiliaria en Alta Definición</title>
    <meta name="description" content="Creamos recorridos virtuales 3D de alta calidad para propiedades residenciales y comerciales en Medellín. Mejore su presencia digital con Metro Virtual Tours.">
    <meta property="og:image" content="https://i.ibb.co/N2QBPDFB/METRO-4.png">
    <link rel="icon" type="image/png" href="https://i.ibb.co/N2QBPDFB/METRO-4.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #020617;
            --bg-card: #0F172A;
            --accent-teal: #4FB0B3;
            --accent-orange: #FF7500;
            --text-main: #F8FAFC;
            --text-dim: #94A3B8;
            --border-glow: rgba(79, 176, 179, 0.2);
        }
        
        * {
            font-family: 'Poppins', sans-serif !important;
            letter-spacing: 0.05em;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(79, 176, 179, 0.05) 1px, transparent 0);
            background-size: 50px 50px;
        }

        .glass-panel {
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(79, 176, 179, 0.1);
        }

        .cyber-card {
            background: var(--bg-card);
            border: 1px solid rgba(79, 176, 179, 0.1);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            border-radius: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .cyber-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 4px; height: 0;
            background: var(--accent-teal);
            transition: height 0.5s ease;
        }

        .cyber-card:hover {
            border-color: rgba(79, 176, 179, 0.4);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(79, 176, 179, 0.1);
        }

        .cyber-card:hover::before {
            height: 100%;
        }

        .text-glow-teal {
            text-shadow: 0 0 10px rgba(79, 176, 179, 0.5);
        }

        .text-glow-orange {
            text-shadow: 0 0 10px rgba(255, 117, 0, 0.5);
        }

        .btn-cyber {
            background: var(--accent-teal);
            color: white;
            box-shadow: 0 0 15px rgba(79, 176, 179, 0.3);
            transition: all 0.3s ease;
        }

        .btn-cyber:hover {
            background: #5dc6c9;
            box-shadow: 0 0 25px rgba(79, 176, 179, 0.5);
            transform: scale(1.02);
        }

        .hero-mesh {
            background: radial-gradient(circle at top right, rgba(79, 176, 179, 0.15), transparent),
                        radial-gradient(circle at bottom left, rgba(255, 117, 0, 0.1), transparent);
        }

        ::-webkit-scrollbar {
          width: 8px;
        }
        ::-webkit-scrollbar-track {
          background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
          background: #1e293b;
          border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: var(--accent-teal);
        }
        
        .mattertag {
          position: absolute;
          width: 14px;
          height: 14px;
          background: white;
          border-radius: 50%;
          border: 3px solid var(--accent-teal);
          box-shadow: 0 0 15px var(--accent-teal);
          cursor: pointer;
          transition: transform 0.3s ease;
        }
        .mattertag:hover {
          transform: scale(1.2);
        }
        .mattertag::after {
          content: '';
          position: absolute;
          inset: -6px;
          border: 1px solid white;
          border-radius: 50%;
          opacity: 0.5;
          animation: ping-slow 2s infinite;
        }
        @keyframes ping-slow {
          0% { transform: scale(1); opacity: 0.5; }
          100% { transform: scale(1.8); opacity: 0; }
        }

        .custom-scrollbar::-webkit-scrollbar {
          width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: rgba(79, 176, 179, 0.3);
          border-radius: 10px;
        }

        @keyframes shimmer {
          100% { transform: translateX(100%); }
        }
        
        @keyframes spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
    </style>
